<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人名片</title>
    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    background:#f2f2f2;
    font-family:"Microsoft Yahei",sans-serif;
    display:flex;
    min-height:100vh;
    justify-content:center;
    align-items:center;
}
.card{
    width:340px;
    background:#ffffff;
    border-radius:16px;
    padding:32px;
    text-align:center;
    box-shadow:0 4px 16px rgba(0,0,0,0.08);
}
.avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:18px;
}
.name{
    font-size:24px;
    font-weight:bold;
    color:#222222;
    margin-bottom:8px;
}
.job{
    color:#666666;
    font-size:16px;
    margin-bottom:20px;
}
.info{
    line-height:2;
    color:#444444;
}
    </style>
</head>
<body>
<div class="card">
    <img class="avatar" src="https://picsum.photos/id/1005/110/110">
    <div class="name">周文秀</div>
    <div class="job">前端开发工程师</div>
    <div class="info">
        📞 电话：186‑8136‑3608<br>
        ✉️ 邮箱：2246994840@qq.com
    </div>
</div>
</body>
</html>
